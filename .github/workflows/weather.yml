name: Tuya Weather Upload

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read Tuya and upload to Weather Underground
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_REGION: ${{ secrets.TUYA_REGION }}
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_STATION_KEY: ${{ secrets.WU_STATION_KEY }}
          TUYA_TEMP_CODE: ${{ secrets.TUYA_TEMP_CODE }}
          TUYA_HUMIDITY_CODE: ${{ secrets.TUYA_HUMIDITY_CODE }}
          TUYA_PRESSURE_CODE: ${{ secrets.TUYA_PRESSURE_CODE }}
          TUYA_WIND_SPEED_CODE: ${{ secrets.TUYA_WIND_SPEED_CODE }}
          TUYA_WIND_GUST_CODE: ${{ secrets.TUYA_WIND_GUST_CODE }}
          TUYA_WIND_DIRECTION_CODE: ${{ secrets.TUYA_WIND_DIRECTION_CODE }}
          TUYA_RAIN_CODE: ${{ secrets.TUYA_RAIN_CODE }}
        run: python weather.py
