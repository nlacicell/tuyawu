name: Update Vevor Weather Data 2

on:
  schedule:
    # Futtatás kb. 10 percenként
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Megakadályozza, hogy a futások egymásra torlódjanak, ha a GitHub késne
concurrency:
  group: weather-sync
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    # Maximum 5 percig futhat, megelőzve a beragadó hálózati kéréseket
    timeout-minutes: 5

    steps:
    - name: Checkout kód
      uses: actions/checkout@v4

    - name: Python beállítása és gyorsítótárazás (Cache)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Függőségek telepítése
      run: |
        python -m pip install --upgrade pip
        pip install requests tinytuya

    - name: Script futtatása
      env:
        TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
        TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
        TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
        WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
        WU_STATION_KEY: ${{ secrets.WU_STATION_KEY }}
      run: python weather.py
