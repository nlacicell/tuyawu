name: Tuya Weather Update

on:
  repository_dispatch:
    types: [weather_update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install tinytuya requests

      - name: Tuya időjárási adatok lekérése
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_STATION_KEY: ${{ secrets.WU_STATION_KEY }}
        run: python weather.py
